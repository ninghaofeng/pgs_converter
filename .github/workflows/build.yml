name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: brew install libass pkgconf ffmpeg
      - name: Build, test and package
        run: bash scripts/build-macos.sh --install-dependencies --gui
      - run: |
          export PKG_CONFIG_PATH="$PWD/build/native/macos-${{ matrix.arch }}/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PKG_CONFIG_PATH"
          go test -race -ldflags "-linkmode=external -extld=/usr/bin/clang++" ./...
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: amd64
            msystem: UCRT64
            packages: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libass mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-ffmpeg
          - runner: windows-11-arm
            arch: arm64
            msystem: CLANGARM64
            packages: mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-libass mingw-w64-clang-aarch64-pkgconf mingw-w64-clang-aarch64-ffmpeg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Windows PowerShell compatibility
        shell: powershell
        run: ./internal/buildscripts/testdata/windows.ps1
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}
      - name: Build, audit and test standalone static executable
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Gui -Msys2Root "${{ steps.msys.outputs.msys2-location }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
